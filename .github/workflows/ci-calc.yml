name: ci-calc
on: [push]
jobs:
    comp:
        name: compilar y testear calc
        runs-on: windows-latest
        steps:
            - name: Config Java
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '21'
            - name: Repositorio
              uses: actions/checkout@v4
            - name: Dir salida
              run: mkdir -p out
            - name: Compile
              run: javac src/*java
            - name: Repositorio
              uses: actions/checkout@v4
            - name: To jar
              run: jar cfe out/calc.jar Main -C out
            - name: Execute
              run: java -jar out/calc.jar
            - name: Upload
              uses: actions/upload-artifact@v4
              with:
                name: app-java
                path: out/calc.jar